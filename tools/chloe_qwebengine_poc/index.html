<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chloe GLB · PyQt6 QWebEngineView</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.45 "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080d13; color: #e8f3fb; }
    #scene { position: fixed; inset: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; }
    .panel { position: fixed; z-index: 2; top: 12px; right: 12px; width: min(286px, calc(100vw - 24px)); padding: 11px 13px; border: 1px solid #274351; border-radius: 9px; background: #07141de8; box-shadow: 0 10px 24px #0008; }
    body.hud-slot .panel { width: min(240px, calc(100vw - 24px)); }
    h1 { margin: 0 0 6px; color: #79e8f0; font-size: 14px; letter-spacing: .09em; }
    #status { color: #c9d8e3; }
    #details { margin-top: 6px; color: #93aaba; font: 11px/1.45 Consolas, monospace; white-space: pre-line; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px; margin-top: 8px; }
    label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    button { padding: 4px 8px; border: 1px solid #37616c; border-radius: 6px; background: #10232c; color: #d9f8fa; cursor: pointer; }
    #hint { position: fixed; z-index: 2; right: 12px; bottom: 10px; padding: 5px 8px; border-radius: 6px; color: #a9bdc8; background: #07141de0; font-size: 11px; }
    .error { color: #ff9b9b !important; }
  </style>
</head>
<body>
  <div id="scene"></div>
  <section class="panel" aria-live="polite">
    <h1>CHLOE · QWEBENGINE / THREE.JS</h1>
    <div id="status">Iniciando WebGL…</div>
    <div id="details"></div>
    <div class="controls">
      <label><input id="animate" type="checkbox" checked disabled> Animação idle</label>
      <button id="frame" type="button" disabled>Enquadrar</button>
    </div>
  </section>
  <div id="hint">Arraste para orbitar · roda para aproximar</div>
  <script src="/viewer.bundle.js" defer></script>
</body>
</html>
